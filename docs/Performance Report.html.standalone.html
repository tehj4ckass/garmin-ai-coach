  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bg-1:        #0c1014;\n  --bg-2:        #11161c;\n  --bg-3:        #161c24;\n  --line:        #1f2731;\n  --line-2:      #2a3441;\n  --ink:         #e6edf3;\n  --ink-2:       #a8b4c0;\n  --ink-3:       #6b7888;\n  --ink-4:       #444f5d;\n  --accent:      #b5ff3a;   /* electric lime */\n  --accent-2:    #7adfff;   /* cyan secondary */\n  --accent-warn: #ffb84a;\n  --accent-bad:  #ff5470;\n  --good:        #4ade80;\n\n  --sans: \"Geist\", \"Inter\", -apple-system, \"Helvetica Neue\", Arial, sans-serif;\n  --mono: \"JetBrains Mono\", ui-monospace, \"Menlo\", monospace;\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin:0; padding:0; }\nbody {\n  background: var(--bg-0);\n  color: var(--ink);\n  font-family: var(--sans);\n  font-size: 13px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  background-image:\n    radial-gradient(1200px 600px at 80% -10%, rgba(181,255,58,.05), transparent 60%),\n    radial-gradient(900px 500px at -10% 30%, rgba(122,223,255,.04), transparent 60%),\n    linear-gradient(var(--bg-0), var(--bg-0));\n  min-height: 100vh;\n}\n\n/* shared */\n.mono { font-family: var(--mono); }\n.num  { font-family: var(--mono); font-variant-numeric: tabular-nums; }\n.micro {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n}\n.micro b { color: var(--ink); font-weight: 500; }\n.lab {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n}\n.lab b { color: var(--ink-2); font-weight: 500; }\n\n.delta { font-family: var(--mono); font-size: 11px; }\n.delta.up { color: var(--good); }\n.delta.dn { color: var(--accent-bad); }\n.delta.warn { color: var(--accent-warn); }\n\n.h-display {\n  font-family: var(--sans);\n  font-weight: 600;\n  font-size: 64px;\n  line-height: .98;\n  letter-spacing: -.03em;\n}\n.h-display em { font-style: normal; color: var(--accent); }\n.h-section {\n  font-family: var(--sans);\n  font-weight: 500;\n  font-size: 28px;\n  letter-spacing: -.015em;\n  line-height: 1;\n}\n.h-card {\n  font-family: var(--sans);\n  font-weight: 500;\n  font-size: 18px;\n  letter-spacing: -.005em;\n  line-height: 1.2;\n}\n\n/* layout */\n.app {\n  max-width: 1320px;\n  margin: 0 auto;\n  padding: 24px 32px 64px;\n}\nhr.r { border: 0; border-top: 1px solid var(--line); margin: 0; }\n\n/* topbar */\n.topbar {\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  align-items: center;\n  gap: 18px;\n  padding: 14px 18px;\n  border: 1px solid var(--line);\n  background: linear-gradient(180deg, var(--bg-2), var(--bg-1));\n  border-radius: 14px;\n  margin-bottom: 20px;\n}\n.brand {\n  display: flex; align-items: center; gap: 12px;\n  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;\n}\n.brand .logo {\n  width: 22px; height: 22px;\n  background: radial-gradient(circle at 30% 30%, var(--accent), #5fa910 70%);\n  border-radius: 6px;\n  box-shadow: 0 0 18px rgba(181,255,58,.45);\n  position: relative;\n}\n.brand .logo::after {\n  content: \"\"; position: absolute; inset: 4px;\n  background: var(--bg-0); border-radius: 3px;\n}\n.brand b { color: var(--ink); font-weight: 500; }\n.tabs {\n  display: flex; gap: 2px;\n  background: var(--bg-3); border: 1px solid var(--line);\n  padding: 3px; border-radius: 10px;\n  justify-self: center;\n}\n.tabs a {\n  font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;\n  color: var(--ink-3); padding: 7px 14px; border-radius: 7px; text-decoration: none;\n}\n.tabs a.active { background: var(--bg-1); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }\n.tabs a:hover { color: var(--ink); }\n.actions { display: flex; gap: 8px; align-items: center; }\n.live {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;\n  padding: 6px 10px; bord ection\">The Diagnosis · three observations<\u002Fh2>\n    <\u002Fdiv>\n    <span class=\"micro\">Synthesised · 04:12 UTC · top-3 cohort<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"g g12\">\n    <div class=\"s8\">\n      <div class=\"insight\">\n        <div class=\"ih\">\n          <span class=\"n\">01 · Strength<\u002Fspan>\n          <span class=\"pill accent\" style=\"margin-left: auto\">conf 0.91<\u002Fspan>\n        <\u002Fdiv>\n        <p>\n          Your <span class=\"mark\">aerobic efficiency at marathon pace has climbed for four straight weeks<\u002Fspan>, and Sunday's long run held a decoupling of just 3.4% — the cleanest of this block. The engine is no longer the limiter. Race plan should now assume a target of <b>3:08 ± 4 min<\u002Fb>, two minutes faster than the spring estimate.\n        <\u002Fp>\n      <\u002Fdiv>\n      <div class=\"insight warn\">\n        <div class=\"ih\">\n          <span class=\"n\">02 · Watchpoint<\u002Fspan>\n          <span class=\"pill warn\" style=\"margin-left: auto\">conf 0.76<\u002Fspan>\n        <\u002Fdiv>\n        <p>\n          Right tibial loading is <span class=\"mark\">11% asymmetric<\u002Fspan> on tempo days, and ground-contact balance has drifted 50.6/49.4 over fourteen sessions. Small, but consistent. <b>Two pre-run calf raises and a Tuesday strength block<\u002Fb> should reverse it before Berlin's volume ramp.\n        <\u002Fp>\n      <\u002Fdiv>\n      <div class=\"insight cyan\">\n        <div class=\"ih\">\n          <span class=\"n\">03 · Prescription<\u002Fspan>\n          <span class=\"pill cyan\" style=\"margin-left: auto\">conf 0.88<\u002Fspan>\n        <\u002Fdiv>\n        <p>\n          You have answered the work. The body is ready for more — and that is exactly why you should not give it more this week. Hold volume, sharpen the threshold session, and <span class=\"mark\">protect Friday's sleep window<\u002Fspan>. A 5% week-over-week stimulus is the highest-return move on the table.\n        <\u00
